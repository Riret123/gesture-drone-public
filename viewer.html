<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drone Camera Feed</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  .wrap { position: fixed; inset: 0; }
  img {
    display: block;
    width: 100%;
    height: 100%;
    /* растягивает кадр на весь вьюпорт, сохраняя пропорции (letterbox
       по краям, если соотношение сторон потока не совпадает с окном) —
       в отличие от max-width/max-height, которые только ограничивают
       сверху, но не заставляют картинку расти до размера окна */
    object-fit: contain;
  }
  #status {
    position: fixed; top: 8px; left: 8px; color: #0f0; font: 14px monospace;
    background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 4px;
  }
</style>
</head>
<body>
  <div id="status">connecting...</div>
  <div class="wrap"><img id="stream" src="/stream" alt="video stream"></div>
  <script>
    const img = document.getElementById('stream');
    const status = document.getElementById('status');
    img.onload = () => { status.textContent = 'live'; };
    img.onerror = () => {
      status.textContent = 'reconnecting...';
      setTimeout(() => { img.src = '/stream?_=' + Date.now(); }, 1000);
    };
  </script>
</body>
</html>
