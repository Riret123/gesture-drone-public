# Конфиг точки доступа для полевых тестов без интернета.
# Запускается НЕ через systemd (unit hostapd замаскирован по умолчанию
# после установки пакета, специально оставлен как есть) — только вручную
# через network/switch_to_ap.sh, бинарником: hostapd -B <этот файл>.

interface=wlan0
driver=nl80211

ssid=Drone_Network
# 2.4 ГГц, канал 6 — без DFS/radar-detection ограничений 5ГГц диапазона,
# максимальная совместимость с Quest 2 и любым ноутом.
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1
country_code=US

auth_algs=1
ignore_broadcast_ssid=0

wpa=2
wpa_passphrase=CHANGE_ME_BEFORE_USE
wpa_key_mgmt=WPA-PSK
wpa_pairwise=CCMP
rsn_pairwise=CCMP
