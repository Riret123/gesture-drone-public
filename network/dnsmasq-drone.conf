# DHCP (без DNS — port=0) для клиентов точки доступа Drone_Network.
# Запускается НЕ через системный сервис dnsmasq (тот отключён:
# sudo systemctl disable --now dnsmasq — по умолчанию пытался слушать
# порт 53 на всех интерфейсах и конфликтовал с systemd-resolved) —
# только вручную через network/switch_to_ap.sh:
#   dnsmasq --conf-file=network/dnsmasq-drone.conf --pid-file=...

interface=wlan0
bind-interfaces
except-interface=lo

# Только DHCP, никакого DNS-релея — точка доступа офлайновая, резолвить
# извне всё равно нечего, а port=0 гарантированно исключает конфликт
# с systemd-resolved (127.0.0.53) на порту 53.
port=0

dhcp-range=192.168.4.10,192.168.4.50,255.255.255.0,12h
dhcp-option=option:router,192.168.4.1
